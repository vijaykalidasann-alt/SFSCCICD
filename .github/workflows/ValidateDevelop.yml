name: Test new CICD
on:
  pull_request:
    types: [edited, opened, reopened, synchronize]
    branches:
      - 'cicddevelop*'
    paths:
      - 'force-app/**'
      
# Jobs to be executed when the above conditions are met

jobs:
    # This is the name of the job. You can give it whatever name you want
    validate-or-deploy-in-salesforce-org:
        # This job runs inside a VM. Here we
        # can specify which OS this VM should run on. 
        # In this case, we are going to run our commands on the latest version
        # of ubuntu
        runs-on: ubuntu-latest
        if: ${{ github.actor != 'dependabot[bot]' }}
        steps:
            # Now we install nodejs in the VM, and specify version 16
            # Use the official action to set up the CLI
            - uses: actions/setup-node@v4
              with:
                # Use a specific, stable version to minimize internal npm warnings
                node-version: '20' 

            # The idea is that the VM can access your remote repository
            # because your repository is an sfdx project.
            # This is a default action that allows us to enter the root 
            # directory of the repository

            # Make sure to specify fetch-depth:0. This allows us to
            # access previous commits that have been pushed to the repository.

            # We'll need this later when we try to figure out which metadata has 
            # changed between commits, so that we can only deploy that metadata
            # to the destination org

            - name: 'Checkout source code'
              uses: actions/checkout@v3
              with:
                fetch-depth: 0
            
            # Now, we need a way to let the developer specify which tests to run, which
            # could be all tests or just the tests relevant to their deployment.

            # To do this, we can ask the developer to name their test classes in the
            # body of the PR, using the following syntax

            # Apex::[CommunitiesLoginControllerTest,MyProfilePageControllerTest]::Apex
            # or Apex::[all]::Apex to run all tests

            # This special delimeter can be added to the PR template so that your 
            # team doesn't have to remember the syntax. 

            # Once a developer has specified a list of classes to run, we need to be able
            # to extract this information from the PR, and pass it on the the VM.

              # Here we print the content of the environment variable and
              # pipe to a a text file.

              # Then we call the local script parsePR.js, which will create
              # a new file called testsToRun.txt. This file will have the list
              # of tests to run separated by a comma

              # Finally, we add the list of tests to the $GITHUB_ENV variable
              # as this allows us to reference the list in a subsequent step.  If you
              # were using a normal env variable, its value would not be available outside this step.
             
                  
            # This is the single most important fix.
            - name: 'Install Salesforce CLI (sf)'
              run: |
                  # Install the modern SF CLI (sf) globally. This resolves dependency conflicts.
                  npm install @salesforce/cli --global

            # Then we install the SFDX-Git-Delta plugin - https://github.com/scolladon/sfdx-git-delta
            # This is an awesome plugin that allows us to extract a package.xml with the metadata
            # that has changed between commits. I highly recommend going over the github readme 
            # for more information on how this works.

            # 3. Clean SFDX-Git-Delta Installation (Ensuring it uses the new CLI)
            - name: 'Installing sfdx git delta'
              run: |
                  # Use the new 'sf' command syntax for plugins if possible, 
                  # or the old one should alias correctly.
                  npm install sfdx-git-delta --global
                  # OR simply: sf plugins install sfdx-git-delta
                  sf plugins # Verify installation

            # Install java as it is required for the next step
            - name: 'updating java'
              run: sudo apt-get update
            - name: 'Installing java'
              run: sudo apt-get install openjdk-8-jdk

            # 4. Clean SFDX Scanner Installation (Scanner needs Node 18.18+ or 20+, which you have)
            - name: 'Installing SFDX scanner'
              run: sf plugins:install @salesforce/sfdx-scanner

            # Prior to setting up this workflow, you have to create a Github Secret
            # that contains the sfdx url of the salesforce org.

            # The steps to generate the url are here 
            # https://developer.salesforce.com/docs/atlas.en-us.sfdx_cli_reference.meta/sfdx_cli_reference/cli_reference_auth_sfdxurl.htm

            # This URL can then be used with the sfdx auth:sfdxurl:store to authenticate
            # the sfdx project in the repositry, against the org from which the URL
            # was generated from. This works just like that, there's no need to create
            # connected apps or any else. 

            # The URL is stored in the Github Secret named SFDX_URL
            # so here we store the URL into a text file
            - name: 'Populate auth file with SFDX_URL secret of salesforce org'
              shell: bash
              run: |
                  echo 'force://PlatformCLI::5Aep8618MtpGySpPxg83rsknlG1y5TrI.sm0ZnG4.M3lKcyCTK9oWza45A3eXqQtRXgmqOGi5VIFA==@orgfarm-8886493b42-dev-ed.develop.my.salesforce.com' > ./SFDX_URL.txt
            # --- AUTHENTICATION STEP (This one worked, but let's make it sf) ---
            # --- AUTHENTICATION STEP ---
            - name: 'Authenticate to Salesforce Org'
              # The correct modern flag is --set-default.
              # The command must use the new 'sf' executable.
              # run: sf org login sfdx-url -f ./SFDX_URL.txt --set-default-alias ${{ inputs.environment }}  <-- OLD (FAILING)
              run: sf org login sfdx-url -f ./SFDX_URL.txt --set-default --alias vjdev

            - name: 'Fetch base branch'
              run: git fetch origin ${{ github.base_ref }}

            - name: 'Get changed files'
              id: changed-files
              run: |
                CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- 'force-app/main/default/')
                echo "Changed files:"
                echo "$CHANGED_FILES"
                echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

            - name: Print changed files
              run: |
                echo "The following files were changed:"
                echo "${{ steps.changed-files.outputs.changed_files }}"    


            # --- DEPLOYMENT STEP 1 ---
            - name: 'Deploy only changed files'
              if: steps.changed-files.outputs.changed_files != ''
              run: |
                set -e
                mkdir -p changed
                for file in ${{ steps.changed-files.outputs.changed_files }}
                do
                  if [[ -f "$file" ]]; then
                    # Copy the changed file
                    mkdir -p "changed/$(dirname "$file")"
                    cp "$file" "changed/$file"
                    # Copy corresponding -meta.xml from HEAD if it exists
                    META_FILE="${file}-meta.xml"
                    if git show "HEAD:$META_FILE" > /dev/null 2>&1; then
                      echo "Adding meta.xml for $file"
                      mkdir -p "changed/$(dirname "$META_FILE")"
                      git show "HEAD:$META_FILE" > "changed/$META_FILE"
                    fi
                  fi
                done
                if [[ -d changed/force-app/main/default ]]; then
                  echo "Deploying only changed metadata..."
                  sf project deploy start -d changed/force-app/main/default --ignore-conflicts --dry-run --target-org vjdev
                else
                  echo "No deployable metadata found under changed/force-app/main/default"
                fi
